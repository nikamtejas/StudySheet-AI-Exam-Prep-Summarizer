name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    # Mongo + MinIO backing M1's ingest integration tests (test/ingest.test.ts).
    # Ports/credentials/bucket match .env.example exactly, so the checked-out
    # .env.example needs no per-job overrides — it already points here.
    #
    # MinIO runs as a plain `docker run` step, not a `services:` entry —
    # GitHub Actions services can't override the container command, and
    # MinIO's official image needs `server /data` passed explicitly (the
    # bitnami image that used to work as a services entry without a command
    # override was removed from Docker Hub's `latest` tag).
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install poppler-utils (pdftoppm — page rasterization)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=studysheet \
            -e MINIO_ROOT_PASSWORD=studysheet-dev \
            minio/minio server /data --console-address ":9001"
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Prepare env
        working-directory: backend
        run: cp .env.example .env
      - name: Wait for Mongo and MinIO
        run: |
          for i in $(seq 1 30); do nc -z localhost 27017 && break; sleep 1; done
          for i in $(seq 1 30); do nc -z localhost 9000 && break; sleep 1; done
      - name: Ensure the MinIO bucket exists
        working-directory: backend
        run: |
          node -e "
          const { S3Client, CreateBucketCommand, HeadBucketCommand } = require('@aws-sdk/client-s3');
          const client = new S3Client({ region: 'auto', endpoint: 'http://localhost:9000', forcePathStyle: true, credentials: { accessKeyId: 'studysheet', secretAccessKey: 'studysheet-dev' } });
          (async () => {
            try { await client.send(new HeadBucketCommand({ Bucket: 'studysheet-dev' })); }
            catch { await client.send(new CreateBucketCommand({ Bucket: 'studysheet-dev' })); }
          })();
          "
      - name: Verify
        working-directory: backend
        run: npm run verify

  frontend:
    name: frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Prepare env
        working-directory: frontend
        run: cp .env.local.example .env.local
      - name: Verify
        working-directory: frontend
        run: npm run verify
      - name: Build (proves it builds with the backend switched off)
        working-directory: frontend
        run: npm run build

  contracts-drift:
    name: contracts (fail if frontend copy is stale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Sync contracts
        working-directory: backend
        run: npm run sync:contracts
      - name: Fail if the synced copy differs from what's committed
        run: git diff --exit-code -- frontend/src/contracts
