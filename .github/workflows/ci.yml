name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Prepare env
        working-directory: backend
        run: cp .env.example .env
      - name: Verify
        working-directory: backend
        run: npm run verify

  frontend:
    name: frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Prepare env
        working-directory: frontend
        run: cp .env.local.example .env.local
      - name: Verify
        working-directory: frontend
        run: npm run verify
      - name: Build (proves it builds with the backend switched off)
        working-directory: frontend
        run: npm run build

  contracts-drift:
    name: contracts (fail if frontend copy is stale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Sync contracts
        working-directory: backend
        run: npm run sync:contracts
      - name: Fail if the synced copy differs from what's committed
        run: git diff --exit-code -- frontend/src/contracts
